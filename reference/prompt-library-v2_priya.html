<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guided Prompt Library</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1410;
            color: #e0d6c8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 20px 10px;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #f5e6c8;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        .header p { color: #8a7a66; font-size: 14px; margin-top: 6px; }

        /* Filters */
        .filters {
            display: flex; justify-content: center; gap: 10px;
            padding: 20px; flex-wrap: wrap;
        }
        .filter-btn {
            padding: 7px 18px; border-radius: 20px;
            border: 1px solid #3a2e22; background: #2a2018;
            color: #a08c70; font-size: 13px; cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn:hover { border-color: #c8a96e; color: #c8a96e; }
        .filter-btn.active {
            background: linear-gradient(135deg, #c8a96e, #a07840);
            color: #1a1410; border-color: #c8a96e; font-weight: 600;
        }

        /* Bookshelf */
        .bookshelf-section {
            padding: 0 40px 60px;
        }
        .shelf {
            position: relative;
            display: flex;
            align-items: flex-end;
            gap: 0;
            padding: 30px 30px 0;
            min-height: 260px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .shelf-board {
            width: 100%;
            height: 18px;
            background: linear-gradient(180deg, #5a3e28 0%, #3d2a1a 40%, #2a1c12 100%);
            border-radius: 0 0 4px 4px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.4);
            position: relative;
        }
        .shelf-board::before {
            content: '';
            position: absolute;
            top: -4px; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(180deg, #7a5838, #5a3e28);
            border-radius: 2px 2px 0 0;
        }
        .shelf-board::after {
            content: '';
            position: absolute;
            bottom: -8px; left: 20px; right: 20px;
            height: 8px;
            background: rgba(0,0,0,0.3);
            filter: blur(6px);
            border-radius: 50%;
        }

        /* Book */
        .book {
            width: 60px;
            cursor: pointer;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom center;
            margin: 0 2px;
        }
        .book:hover {
            transform: translateY(-14px) scale(1.04);
            z-index: 10;
        }
        .book-spine {
            height: 200px;
            border-radius: 3px 6px 6px 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 4px;
            position: relative;
            overflow: hidden;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.5), inset -2px 0 4px rgba(0,0,0,0.2);
        }
        .book-spine::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: rgba(0,0,0,0.25);
        }
        .book-spine::after {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 1px;
            background: rgba(255,255,255,0.06);
        }
        .book-title {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 160px;
        }
        .book-id {
            writing-mode: vertical-rl;
            font-size: 9px;
            color: rgba(255,255,255,0.4);
            margin-top: 6px;
        }

        /* Tooltip on hover */
        .book-tooltip {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #2a2018;
            border: 1px solid #4a3828;
            border-radius: 10px;
            padding: 12px 16px;
            min-width: 180px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 100;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        .book:hover .book-tooltip {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
        .book-tooltip h4 { font-size: 14px; color: #f5e6c8; margin-bottom: 4px; }
        .book-tooltip .tt-cat { font-size: 11px; color: #c8a96e; margin-bottom: 6px; }
        .book-tooltip .tt-caps { display: flex; gap: 4px; flex-wrap: wrap; }
        .book-tooltip .tt-tag {
            font-size: 10px; padding: 2px 8px; border-radius: 4px;
            background: rgba(200,169,110,0.15); color: #c8a96e;
            border: 1px solid rgba(200,169,110,0.2);
        }

        /* Color palettes for books */
        .clr-0 { background: linear-gradient(180deg, #8B2500, #6B1C00); }
        .clr-1 { background: linear-gradient(180deg, #1B4B6C, #0F3050); }
        .clr-2 { background: linear-gradient(180deg, #2D5A27, #1A3A18); }
        .clr-3 { background: linear-gradient(180deg, #6B3A8A, #4A2068); }
        .clr-4 { background: linear-gradient(180deg, #8B6914, #6B5010); }
        .clr-5 { background: linear-gradient(180deg, #1a4a4a, #0e3030); }
        .clr-6 { background: linear-gradient(180deg, #7a3040, #5a1828); }
        .clr-7 { background: linear-gradient(180deg, #3a4a6a, #2a3450); }
        .clr-8 { background: linear-gradient(180deg, #5a4a2a, #3a3018); }
        .clr-9 { background: linear-gradient(180deg, #2a2a5a, #1a1a40); }
        .clr-10 { background: linear-gradient(180deg, #6a4a3a, #4a3020); }
        .clr-11 { background: linear-gradient(180deg, #2a5a3a, #184028); }
        .clr-12 { background: linear-gradient(180deg, #5a2a4a, #401838); }
        .clr-13 { background: linear-gradient(180deg, #4a5a2a, #303a18); }
        .clr-14 { background: linear-gradient(180deg, #3a3a3a, #222); }

        /* Height variations */
        .h-sm .book-spine { height: 180px; }
        .h-md .book-spine { height: 200px; }
        .h-lg .book-spine { height: 220px; }
        .h-xl .book-spine { height: 235px; }

        /* Width variations */
        .w-thin { width: 48px; }
        .w-med { width: 60px; }
        .w-thick { width: 72px; }

        /* ========== PPT VIEWER ========== */
        .ppt-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            display: none;
            animation: fadeIn 0.3s;
        }
        .ppt-overlay.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Book opening animation */
        .book-open-anim {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            perspective: 1200px;
            z-index: 2001;
        }
        .book-cover-anim {
            width: 320px; height: 440px;
            position: relative;
            transform-style: preserve-3d;
        }
        .book-front, .book-back {
            position: absolute; inset: 0;
            border-radius: 4px 12px 12px 4px;
            backface-visibility: hidden;
        }
        .book-front {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 40px;
            box-shadow: 4px 4px 20px rgba(0,0,0,0.6);
        }
        .book-front h2 {
            font-size: 24px; color: #fff;
            text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .book-front .bf-cat {
            font-size: 12px; color: rgba(255,255,255,0.6);
            margin-top: 10px; text-transform: uppercase; letter-spacing: 2px;
        }
        .book-front .bf-line {
            width: 60px; height: 2px; margin: 16px 0;
            background: rgba(255,255,255,0.3); border-radius: 1px;
        }

        /* Slide viewer */
        .ppt-viewer {
            position: fixed; inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2002;
        }
        .ppt-viewer.active { display: flex; }

        .ppt-top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 16px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent);
        }
        .ppt-top-bar h3 {
            font-size: 16px; color: #f5e6c8; font-weight: 600;
        }
        .ppt-top-bar .ppt-close {
            width: 40px; height: 40px;
            border-radius: 10px; border: 1px solid #3a2e22;
            background: rgba(42,32,24,0.8);
            color: #a08c70; font-size: 20px;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .ppt-top-bar .ppt-close:hover { background: #8B2500; color: #fff; border-color: #8B2500; }

        .slide-stage {
            width: 80%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 20px 80px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide-content {
            text-align: center;
            padding: 40px;
            animation: slideReveal 0.5s ease;
        }
        @keyframes slideReveal {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .slide-content .slide-icon {
            width: 64px; height: 64px;
            margin: 0 auto 20px;
            background: #f0ebe3;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
        }
        .slide-content .slide-icon svg { width: 32px; height: 32px; stroke: #8a7a66; }
        .slide-content h2 { font-size: 28px; color: #1a1410; margin-bottom: 8px; }
        .slide-content p { font-size: 14px; color: #8a7a66; max-width: 500px; margin: 0 auto; }
        .slide-content .slide-badge {
            display: inline-block; margin-top: 16px;
            padding: 4px 14px; border-radius: 6px;
            background: #f5efe5; color: #8a6a30;
            font-size: 12px; font-weight: 600;
        }

        /* Nav arrows */
        .slide-nav {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            width: 48px; height: 48px;
            border-radius: 50%;
            background: rgba(42,32,24,0.8);
            border: 1px solid #3a2e22;
            color: #c8a96e;
            font-size: 20px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            z-index: 10;
        }
        .slide-nav:hover { background: #c8a96e; color: #1a1410; }
        .slide-nav.prev { left: -70px; }
        .slide-nav.next { right: -70px; }
        .slide-nav:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

        /* Bottom bar */
        .ppt-bottom-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 16px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(0deg, rgba(0,0,0,0.6), transparent);
        }
        .slide-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #3a2e22;
            border: 1px solid #4a3828;
            cursor: pointer;
            transition: all 0.3s;
        }
        .slide-dot.active {
            background: #c8a96e;
            border-color: #c8a96e;
            transform: scale(1.3);
        }
        .slide-dot:hover { border-color: #c8a96e; }
        .slide-counter {
            color: #6a5a46;
            font-size: 13px;
            margin-left: 16px;
        }

        /* Slide thumbnails strip */
        .thumb-strip {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            overflow-x: auto;
            padding: 4px 0 10px;
            max-width: 900px;
        }
        .thumb-strip::-webkit-scrollbar { height: 4px; }
        .thumb-strip::-webkit-scrollbar-thumb { background: #3a2e22; border-radius: 2px; }
        .thumb-item {
            min-width: 100px; aspect-ratio: 16/9;
            background: #2a2018;
            border: 2px solid #3a2e22;
            border-radius: 6px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: #6a5a46;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .thumb-item.active { border-color: #c8a96e; background: #3a2e18; color: #c8a96e; }
        .thumb-item:hover { border-color: #8a7a66; }

        .empty-state {
            text-align: center; padding: 80px;
            color: #5a4a36; grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .bookshelf-section { padding: 0 10px 40px; }
            .shelf { padding: 20px 10px 0; }
            .book { width: 48px; }
            .book-spine { height: 160px; }
            .book-title { font-size: 9px; }
            .slide-stage { width: 95%; }
            .slide-nav.prev { left: -50px; }
            .slide-nav.next { right: -50px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📚 Guided Prompt Library</h1>
    <p>Select a book from the shelf to explore its template</p>
</div>

<div class="filters">
    <button class="filter-btn active" onclick="setFilter('all')">All</button>

    </div>
    <div class="thumb-strip" id="thumbStrip"></div>
    <div class="ppt-bottom-bar" id="pptDots"></div>
</div>

const heights = ['h-sm','h-md','h-lg','h-xl'];
const widths = ['w-thin','w-med','w-thick'];
let activeFilter = 'all';
let currentPrompt = null;
let currentSlide = 0;

function renderShelves() {
    const section = document.getElementById('bookshelfSection');
    const filtered = prompts.filter(p => activeFilter === 'all' || p.category === activeFilter);

    if (!filtered.length) {
        section.innerHTML = '<div class="empty-state"><p>No books on this shelf</p></div>';
        return;
    }

    const shelvesCount = Math.ceil(filtered.length / 8);
    let html = '';

    for (let s = 0; s < shelvesCount; s++) {
        const shelfBooks = filtered.slice(s * 8, (s + 1) * 8);
        html += '<div class="shelf">';
        shelfBooks.forEach((p, i) => {
            const h = heights[(p.id + i) % heights.length];
            const w = widths[p.id % widths.length];
            html += `
                <div class="book ${h} ${w}" onclick="openBook(${p.id})">
                    <div class="book-spine clr-${p.id - 1}">
                        <span class="book-title">${p.name}</span>
                        <span class="book-id">#${p.id}</span>
                    </div>
                    <div class="book-tooltip">
                        <h4>${p.name}</h4>
                        <div class="tt-cat">${p.category}</div>
                        <div class="tt-caps">
                            ${p.capabilities.map(c => `<span class="tt-tag">${c}</span>`).join('')}
                        </div>
                    </div>
                </div>`;
        });
        html += '<div class="shelf-board"></div></div>';
    }
    section.innerHTML = html;
}

function setFilter(cat) {
    activeFilter = cat;
    document.querySelectorAll('.filter-btn').forEach(b => {
        const label = b.textContent.trim();
        const match = cat === 'all' ? label === 'All' :
            cat === 'Planning and Communication' ? label === 'Planning & Comm.' : label === cat;
        b.classList.toggle('active', match);
    });
    renderShelves();
}

function openBook(id) {
    currentPrompt = prompts.find(p => p.id === id);
    currentSlide = 0;

    document.getElementById('pptOverlay').classList.add('active');
    document.getElementById('pptTitle').textContent = currentPrompt.name;

    // Build thumbnail strip
    const strip = document.getElementById('thumbStrip');
    strip.innerHTML = currentPrompt.slides.map((s, i) =>
        `<div class="thumb-item ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})">Slide ${i + 1}</div>`
    ).join('');

    // Build dots
    const dots = document.getElementById('pptDots');
    dots.innerHTML = currentPrompt.slides.map((_, i) =>
        `<div class="slide-dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`
    ).join('') + `<span class="slide-counter">1 / ${currentPrompt.slides.length}</span>`;

    renderSlide();

    setTimeout(() => {
        document.getElementById('pptViewer').classList.add('active');
    }, 100);

    document.body.style.overflow = 'hidden';
}

function renderSlide() {
    const s = currentPrompt.slides[currentSlide];
    const icons = [
        `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
        `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>`,
        `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
        `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
        `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>`,
    ];

    document.getElementById('slideContent').innerHTML = `
        <div class="slide-icon">${icons[currentSlide % icons.length]}</div>
        <h2>${s.title}</h2>
        <span class="slide-badge">${s.sub}</span>
        <p style="margin-top:20px">${s.body}</p>
    `;

    document.getElementById('prevBtn').disabled = currentSlide === 0;
    document.getElementById('nextBtn').disabled = currentSlide === currentPrompt.slides.length - 1;

    // Update dots & thumbs
    document.querySelectorAll('.slide-dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    document.querySelectorAll('.thumb-item').forEach((t, i) => t.classList.toggle('active', i === currentSlide));
    const counter = document.querySelector('.slide-counter');
    if (counter) counter.textContent = `${currentSlide + 1} / ${currentPrompt.slides.length}`;
}

function changeSlide(dir) {
    const next = currentSlide + dir;
    if (next >= 0 && next < currentPrompt.slides.length) {
        currentSlide = next;
        renderSlide();
    }
}

function goToSlide(i) {
    currentSlide = i;
    renderSlide();
}

function closePPT() {
    document.getElementById('pptViewer').classList.remove('active');
    document.getElementById('pptOverlay').classList.remove('active');
    document.body.style.overflow = '';
    currentPrompt = null;
}

document.addEventListener('keydown', e => {
    if (!currentPrompt) return;
    if (e.key === 'Escape') closePPT();
    if (e.key === 'ArrowRight') changeSlide(1);
    if (e.key === 'ArrowLeft') changeSlide(-1);
});

renderShelves();
</script>

</body>
</html>
