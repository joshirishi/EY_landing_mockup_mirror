name: Mirror to EY_landing_mockup_mirror

on:
  push:
    branches: ["**"]
    tags: ["**"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Swap SDK token in index.html
        run: |
          sed -i 's/data-sdk-token="echo_sdk_[^"]*"/data-sdk-token="${{ secrets.ECHO_SDK_TOKEN }}"/' index.html

      - name: Configure SSH for mirror
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > ~/.ssh/mirror_deploy
          chmod 600 ~/.ssh/mirror_deploy
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          printf 'Host mirror-github\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/mirror_deploy\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Push all branches and tags to mirror
        run: |
          git remote add mirror git@mirror-github:joshirishi/EY_landing_mockup_mirror.git
          git push mirror --all --force
          git push mirror --tags --force
