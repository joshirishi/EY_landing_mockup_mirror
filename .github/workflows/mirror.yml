name: Mirror to EY_landing_mockup_mirror

on:
  push:
    branches: ["**"]
    tags: ["**"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Load SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_DEPLOY_KEY }}

      - name: Swap SDK token and amend commit
        env:
          ECHO_SDK_TOKEN: ${{ secrets.ECHO_SDK_TOKEN }}
        run: |
          sed -i "s/data-sdk-token=\"echo_sdk_[^\"]*\"/data-sdk-token=\"${ECHO_SDK_TOKEN}\"/" index.html
          git config user.email "mirror-bot@github.com"
          git config user.name "Mirror Bot"
          if ! git diff --quiet index.html; then
            git add index.html
            git commit --amend --no-edit
          fi

      - name: Push all branches and tags to mirror
        run: |
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          git remote add mirror git@github.com:joshirishi/EY_landing_mockup_mirror.git || \
            git remote set-url mirror git@github.com:joshirishi/EY_landing_mockup_mirror.git
          git fetch origin '+refs/heads/*:refs/heads/*'
          git fetch origin '+refs/tags/*:refs/tags/*'
          git push mirror --all --force
          git push mirror --tags --force
