name: Mirror to EY_landing_mockup_mirror

on:
  push:
    branches: ["**"]
    tags: ["**"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Swap SDK token in index.html
        run: |
          sed -i 's/data-sdk-token="echo_sdk_[^"]*"/data-sdk-token="${{ secrets.ECHO_SDK_TOKEN }}"/' index.html

      - name: Configure SSH for mirror
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIRROR_DEPLOY_KEY }}" > ~/.ssh/mirror_deploy
          chmod 600 ~/.ssh/mirror_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host mirror-github
            HostName github.com
            User git
            IdentityFile ~/.ssh/mirror_deploy
          EOF

      - name: Push mirror (all branches + tags)
        run: |
          git remote add mirror git@mirror-github:joshirishi/EY_landing_mockup_mirror.git
          git push mirror --mirror
